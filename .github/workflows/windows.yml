name: Windows build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  CRAFT_TARGET: windows-cl-msvc2022-x86_64
  CRAFT_MASTER_LOCATION: ${{ github.workspace }}/CraftMaster
  CRAFT_MASTER_CONFIG: ${{ github.workspace }}/craftmaster.ini

jobs:
  build:
    name: Build ghostwriter
    runs-on: windows-2022
    timeout-minutes: 240

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Clone CraftMaster
        shell: pwsh
        run: |
          git clone --depth=1 `
            https://github.com/KDE/craftmaster.git `
            "${{ env.CRAFT_MASTER_LOCATION }}"

      - name: Install CraftMaster blueprint
        shell: pwsh
        run: |
          $blueprintRoot = Join-Path `
            "${{ env.CRAFT_MASTER_LOCATION }}" `
            "blueprints"

          $ghostwriterDir = Join-Path `
            $blueprintRoot `
            "kde\ghostwriter"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $ghostwriterDir | Out-Null

          @'
          import info

          from Package.CMakePackageBase import CMakePackageBase


          class subinfo(info.infoclass):

              def setTargets(self):
                  self.displayName = "ghostwriter"
                  self.description = "Text editor for Markdown"
                  self.webpage = "https://github.com/KDE/ghostwriter"

                  self.svnTargets["master"] = \
                      "https://github.com/KDE/ghostwriter.git|master"

                  self.defaultTarget = "master"

              def setDependencies(self):
                  self.buildDependencies[
                      "kde/frameworks/extra-cmake-modules"
                  ] = None

                  self.runtimeDependencies["libs/qt/qtbase"] = None
                  self.runtimeDependencies["libs/qt/qtsvg"] = None
                  self.runtimeDependencies["libs/qt/qtwebchannel"] = None
                  self.runtimeDependencies["libs/qt/qtwebengine"] = None

                  self.runtimeDependencies[
                      "kde/frameworks/tier1/kcoreaddons"
                  ] = None

                  self.runtimeDependencies[
                      "kde/frameworks/tier1/kwidgetsaddons"
                  ] = None

                  self.runtimeDependencies[
                      "kde/frameworks/tier1/sonnet"
                  ] = None

                  self.runtimeDependencies[
                      "kde/frameworks/tier2/kconfig"
                  ] = None

                  self.runtimeDependencies[
                      "kde/frameworks/tier3/kconfigwidgets"
                  ] = None

                  self.runtimeDependencies[
                      "kde/frameworks/tier3/kxmlgui"
                  ] = None

                  self.runtimeDependencies[
                      "kde/frameworks/tier3/kiconthemes"
                  ] = None

                  self.runtimeDependencies[
                      "kde/frameworks/tier1/breeze-icons"
                  ] = None


          class Package(CMakePackageBase):

              def __init__(self, **args):
                  CMakePackageBase.__init__(self, **args)
          '@ | Set-Content `
            -Encoding UTF8 `
            (Join-Path $ghostwriterDir "ghostwriter.py")

      - name: Create CraftMaster configuration
        shell: pwsh
        run: |
          $root = "${{ github.workspace }}\craft-work"

          @"
          [General]
          Branch = master
          ShallowClone = True

          [Variables]
          Root = $root

          [GeneralSettings]
          Compile/BuildType = Release
          ContinuousIntegration/Enabled = True
          General/KDECompiler = msvc2022
          General/Architecture = x64

          [windows-cl-msvc2022-x86_64]
          General/KDECompiler = msvc2022
          General/Architecture = x64

          Write-Host "CraftMaster configuration:"
          Get-Content "${{ env.CRAFT_MASTER_CONFIG }}"

      - name: Set up Visual Studio environment
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

          $vsPath = & $vswhere `
            -latest `
            -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath

          if (-not $vsPath) {
            throw "Visual Studio 2022 with MSVC was not found."
          }

          $vsPath = $vsPath.Trim()

          Write-Host "Visual Studio: $vsPath"

          $vsDevCmd = Join-Path `
            $vsPath `
            "Common7\Tools\VsDevCmd.bat"

          if (-not (Test-Path $vsDevCmd)) {
            throw "VsDevCmd.bat not found: $vsDevCmd"
          }

          # Import the complete VS developer environment into
          # the GitHub Actions environment.
          $envDump = cmd.exe /s /c `
            "`"$vsDevCmd`" -arch=x64 -host_arch=x64 && set"

          foreach ($line in $envDump) {
            if ($line -match '^([^=]+)=(.*)$') {
              $name = $matches[1]
              $value = $matches[2]

              # Avoid writing pseudo variables.
              if ($name -and $value) {
                "$name=$value" >> $env:GITHUB_ENV
                Set-Item "env:$name" $value
              }
            }
          }

          Write-Host ""
          Write-Host "VSINSTALLDIR=$env:VSINSTALLDIR"
          Write-Host "VCINSTALLDIR=$env:VCINSTALLDIR"

          Write-Host ""
          Write-Host "cl.exe:"
          where.exe cl

          Write-Host ""
          Write-Host "cmake.exe:"
          where.exe cmake

          Write-Host ""
          Write-Host "MSBuild.exe:"
          where.exe msbuild

      - name: Set up Craft
        shell: pwsh
        run: |
          python "${{ env.CRAFT_MASTER_LOCATION }}/CraftMaster.py" `
            --config "${{ env.CRAFT_MASTER_CONFIG }}" `
            --targets "${{ env.CRAFT_TARGET }}" `
            --setup

      - name: Show Craft environment
        shell: pwsh
        run: |
          $craftRoot = "${{ github.workspace }}\craft-work"

          Write-Host "=== Craft root ==="
          Get-ChildItem $craftRoot

          Write-Host ""
          Write-Host "=== Target directory ==="
          Get-ChildItem `
            "$craftRoot\${{ env.CRAFT_TARGET }}" `
            -ErrorAction Stop

          Write-Host ""
          Write-Host "=== Searching for CraftSettings.ini ==="

          Get-ChildItem `
            "$craftRoot\${{ env.CRAFT_TARGET }}" `
            -Recurse `
            -File `
            -Filter "CraftSettings.ini" `
            -ErrorAction SilentlyContinue |
            ForEach-Object {
              Write-Host $_.FullName
            }

          Write-Host ""
          Write-Host "=== Searching for Craft settings files ==="

          Get-ChildItem `
            "$craftRoot\${{ env.CRAFT_TARGET }}" `
            -Recurse `
            -File `
            -ErrorAction SilentlyContinue |
            Where-Object {
              $_.Name -match "CraftSettings|settings"
            } |
            Select-Object FullName

      - name: Diagnose Craft VC detection deeply
        shell: pwsh
        run: |
          $file = "${{ github.workspace }}\craft-work\${{ env.CRAFT_TARGET }}\craft\bin\CraftSetupHelper.py"
          $lines = Get-Content $file

          Write-Host "=== CraftSetupHelper.py: 180-275 ==="

          for ($i = 180; $i -le 275; $i++) {
            if ($i -le $lines.Count) {
              "{0}: {1}" -f $i, $lines[$i - 1]
            }
          }

          Write-Host ""
          Write-Host "=== Calls to _callVCVER ==="

          Get-ChildItem `
            "${{ github.workspace }}\craft-work\${{ env.CRAFT_TARGET }}\craft" `
            -Recurse `
            -File `
            -Include *.py |
            Select-String `
              -Pattern "_callVCVER" `
              -Context 5,8 |
            ForEach-Object {
              Write-Host ""
              Write-Host "FILE: $($_.Path)"
              Write-Host "LINE: $($_.LineNumber)"
              $_.Context.PreContext | ForEach-Object { Write-Host $_ }
              Write-Host ">>> $($_.Line)"
              $_.Context.PostContext | ForEach-Object { Write-Host $_ }
            }

          Write-Host ""
          Write-Host "=== Craft compiler signature ==="

          $compiler = "${{ github.workspace }}\craft-work\${{ env.CRAFT_TARGET }}\craft\bin\CraftCompiler.py"

          Select-String `
            -Path $compiler `
            -Pattern "msvc2022|signature|Abi|version" `
            -Context 3,5 |
            Select-Object -First 100 |
            ForEach-Object {
              Write-Host ""
              Write-Host "$($_.Path):$($_.LineNumber)"
              $_.Context.PreContext | ForEach-Object { Write-Host $_ }
              Write-Host ">>> $($_.Line)"
              $_.Context.PostContext | ForEach-Object { Write-Host $_ }
            }

          Write-Host ""
          Write-Host "=== Direct vswhere tests ==="

          $vswhere = "${{ github.workspace }}\craft-work\${{ env.CRAFT_TARGET }}\craft\bin\3rdparty\vswhere\vswhere.exe"

          Write-Host "--- Any VS with VC ---"
          & $vswhere `
            -latest `
            -products "*" `
            -requires "Microsoft.VisualStudio.Component.VC.Tools.x86.x64" `
            -property installationPath

          Write-Host ""
          Write-Host "--- VS 2022 with VC ---"
          & $vswhere `
            -latest `
            -products "*" `
            -version "[17,18)" `
            -requires "Microsoft.VisualStudio.Component.VC.Tools.x86.x64" `
            -property installationPath

          Write-Host ""
          Write-Host "--- Catalog product version ---"
          & $vswhere `
            -latest `
            -products "*" `
            -requires "Microsoft.VisualStudio.Component.VC.Tools.x86.x64" `
            -property catalog_productLineVersion

          Write-Host ""
          Write-Host "--- Installation version ---"
          & $vswhere `
            -latest `
            -products "*" `
            -requires "Microsoft.VisualStudio.Component.VC.Tools.x86.x64" `
            -property installationVersion

          Write-Host ""
          Write-Host "--- Full JSON ---"
          & $vswhere `
            -latest `
            -products "*" `
            -requires "Microsoft.VisualStudio.Component.VC.Tools.x86.x64" `
            -format json

      - name: Diagnose exact Craft VS component
        shell: pwsh
        run: |
          $vswhere = "${{ github.workspace }}\craft-work\${{ env.CRAFT_TARGET }}\craft\bin\3rdparty\vswhere\vswhere.exe"

          Write-Host "=== vswhere ==="
          Write-Host $vswhere
          & $vswhere -version
          Write-Host "Exit code: $LASTEXITCODE"

          Write-Host ""
          Write-Host "=== Any VS with VC.Tools ==="
          & $vswhere `
            -latest `
            -products "*" `
            -requires "Microsoft.VisualStudio.Component.VC.Tools.x86.x64" `
            -property installationPath

          Write-Host "Exit code: $LASTEXITCODE"

          Write-Host ""
          Write-Host "=== Exact component Craft is expected to use ==="

          $component = "Microsoft.VisualStudio.Component.VCv143.x86.x64"

          Write-Host "Component:"
          Write-Host $component

          Write-Host ""
          Write-Host "=== vswhere with exact component ==="

          & $vswhere `
            -latest `
            -products "*" `
            -requires $component `
            -property installationPath

          Write-Host "Exit code: $LASTEXITCODE"

          Write-Host ""
          Write-Host "=== Craft-style command with duplicate -products ==="

          & $vswhere `
            -property installationPath `
            -nologo `
            -latest `
            -products "*" `
            -products "*" `
            -requires $component

          Write-Host "Exit code: $LASTEXITCODE"

          Write-Host ""
          Write-Host "=== Installed VC components from vswhere JSON ==="

          $json = & $vswhere `
            -latest `
            -products "*" `
            -format json

          $instances = $json | ConvertFrom-Json

          foreach ($instance in $instances) {
            Write-Host ""
            Write-Host "Installation: $($instance.installationPath)"

            if ($instance.catalog.productLineVersion) {
              Write-Host "Product line: $($instance.catalog.productLineVersion)"
            }

            if ($instance.properties) {
              Write-Host "Properties:"
              $instance.properties.psobject.Properties |
                ForEach-Object {
                  Write-Host "  $($_.Name) = $($_.Value)"
                }
            }
          }

          Write-Host ""
          Write-Host "=== VC toolset directories ==="

          $vcTools = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Tools\MSVC"

          if (Test-Path $vcTools) {
            Get-ChildItem $vcTools -Directory |
              Select-Object -ExpandProperty Name
          }
          else {
            Write-Host "VC tools directory does not exist:"
            Write-Host $vcTools
          }

          Write-Host ""
          Write-Host "=== Direct CraftSetupHelper values ==="

          $craftSetup = "${{ github.workspace }}\craft-work\${{ env.CRAFT_TARGET }}\craft\bin\CraftSetupHelper.py"

          Select-String `
            -Path $craftSetup `
            -Pattern "getMsvcPlatformToolset|VCv143|Microsoft.VisualStudio.Component.VC\." `
            -Context 2,3 |
            ForEach-Object {
              Write-Host ""
              Write-Host "$($_.Path):$($_.LineNumber)"
              $_.Context.PreContext | ForEach-Object { Write-Host $_ }
              Write-Host ">>> $($_.Line)"
              $_.Context.PostContext | ForEach-Object { Write-Host $_ }
            }


      - name: Diagnose Craft MSVC detection
        shell: pwsh
        run: |
          $target = "${{ github.workspace }}\craft-work\${{ env.CRAFT_TARGET }}"
          $craft = "$target\craft"

          Write-Host "=== CraftSettings.ini ==="
          Get-Content "$target\etc\CraftSettings.ini"

          Write-Host ""
          Write-Host "=== Craft vswhere ==="

          $vswhere = "$craft\bin\3rdparty\vswhere\vswhere.exe"

          & $vswhere `
            -latest `
            -products "*" `
            -requires "Microsoft.VisualStudio.Component.VC.Tools.x86.x64" `
            -property installationPath

          Write-Host ""
          Write-Host "=== CraftSetupHelper relevant code ==="

          $file = "$craft\bin\CraftSetupHelper.py"
          $lines = Get-Content $file

          for ($i = 194; $i -le 267; $i++) {
            "{0}: {1}" -f $i, $lines[$i - 1]
          }

          Write-Host ""
          Write-Host "=== Running actual Craft command ==="

          python "${{ env.CRAFT_MASTER_LOCATION }}\CraftMaster.py" `
            --config "${{ env.CRAFT_MASTER_CONFIG }}" `
            --targets "${{ env.CRAFT_TARGET }}" `
            --verbose `
            -c `
            --install-deps `
            ghostwriter

      - name: Build ghostwriter
        shell: pwsh
        run: |
          Write-Host "Running Craft..."

          python "${{ env.CRAFT_MASTER_LOCATION }}/CraftMaster.py" `
            --config "${{ env.CRAFT_MASTER_CONFIG }}" `
            --targets "${{ env.CRAFT_TARGET }}" `
            -c `
            --install-deps `
            ghostwriter

      - name: Package ghostwriter
        shell: pwsh
        run: |
          python "${{ env.CRAFT_MASTER_LOCATION }}/CraftMaster.py" `
            --config "${{ env.CRAFT_MASTER_CONFIG }}" `
            --targets "${{ env.CRAFT_TARGET }}" `
            -c `
            --package `
            ghostwriter

      - name: Find generated installer
        shell: pwsh
        run: |
          $root = "${{ github.workspace }}\craft-work\${{ env.CRAFT_TARGET }}"

          Write-Host "Searching for ghostwriter installer under:"
          Write-Host $root

          $installer = Get-ChildItem `
            $root `
            -Recurse `
            -File `
            -Filter "ghostwriter*.exe" `
            -ErrorAction SilentlyContinue |
            Where-Object {
              $_.FullName -notmatch "\\bin\\ghostwriter\.exe$"
            } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if (-not $installer) {
            Write-Host "Files matching ghostwriter:"
            Get-ChildItem `
              $root `
              -Recurse `
              -File `
              -ErrorAction SilentlyContinue |
              Where-Object {
                $_.Name -match "ghostwriter"
              } |
              Select-Object FullName, Length

            throw "Could not find the generated ghostwriter installer."
          }

          Write-Host "Installer found:"
          Write-Host $installer.FullName

          Copy-Item `
            $installer.FullName `
            "${{ github.workspace }}\ghostwriter-windows-x64-installer.exe"

      - name: Locate installed ghostwriter
        shell: pwsh
        run: |
          $root = "${{ github.workspace }}\craft-work\${{ env.CRAFT_TARGET }}"

          $exe = Get-ChildItem `
            $root `
            -Recurse `
            -File `
            -Filter "ghostwriter.exe" `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $exe) {
            throw "Could not find ghostwriter.exe."
          }

          Write-Host "ghostwriter.exe:"
          Write-Host $exe.FullName

          "GHOSTWRITER_ROOT=$($exe.Directory.Parent.FullName)" `
            >> $env:GITHUB_ENV

      - name: Create portable ZIP
        shell: pwsh
        run: |
          $root = $env:GHOSTWRITER_ROOT

          Write-Host "Portable application root:"
          Write-Host $root

          $portableRoot = `
            "${{ github.workspace }}\portable\ghostwriter"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $portableRoot | Out-Null

          Copy-Item `
            "$root\*" `
            $portableRoot `
            -Recurse `
            -Force

          Compress-Archive `
            -Path "$portableRoot\*" `
            -DestinationPath `
              "${{ github.workspace }}\ghostwriter-windows-x64-portable.zip" `
            -Force

      - name: Verify portable ZIP
        shell: pwsh
        run: |
          $zip = `
            "${{ github.workspace }}\ghostwriter-windows-x64-portable.zip"

          if (-not (Test-Path $zip)) {
            throw "Portable ZIP was not created."
          }

          Add-Type `
            -AssemblyName System.IO.Compression.FileSystem

          $archive = `
            [System.IO.Compression.ZipFile]::OpenRead($zip)

          $exe = $archive.Entries |
            Where-Object {
              $_.FullName -eq "bin/ghostwriter.exe"
            }

          if (-not $exe) {
            $archive.Dispose()
            throw "Portable ZIP does not contain bin/ghostwriter.exe."
          }

          $archive.Dispose()

          Write-Host "Portable ZIP verified successfully."

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: ghostwriter-windows-x64-installer
          path: ghostwriter-windows-x64-installer.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload portable Windows build
        uses: actions/upload-artifact@v4
        with:
          name: ghostwriter-windows-x64-portable
          path: ghostwriter-windows-x64-portable.zip
          if-no-files-found: error
          retention-days: 30
