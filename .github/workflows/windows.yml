name: Windows build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  CRAFT_TARGET: windows-cl-msvc2022-x86_64
  CRAFT_MASTER_LOCATION: ${{ github.workspace }}/CraftMaster
  CRAFT_MASTER_CONFIG: ${{ github.workspace }}/craftmaster.ini

jobs:
  build:
    name: Build ghostwriter
    runs-on: windows-2022
    timeout-minutes: 180

    steps:
      - name: Checkout workflow
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download CraftMaster
        shell: pwsh
        run: |
          git clone -q --depth=1 `
            https://invent.kde.org/packaging/craftmaster.git `
            "${{ env.CRAFT_MASTER_LOCATION }}"

      - name: Add local Craft blueprint repository
        shell: pwsh
        run: |
          python "${{ env.CRAFT_MASTER_LOCATION }}/CraftMaster.py" `
            --config "${{ env.CRAFT_MASTER_CONFIG }}" `
            --target "${{ env.CRAFT_TARGET }}" `
            -c `
            --add-blueprint-repository `
            "${{ github.workspace }}/craft"

      - name: Set up Craft
        shell: pwsh
        run: |
          python "${{ env.CRAFT_MASTER_LOCATION }}/CraftMaster.py" `
            --config "${{ env.CRAFT_MASTER_CONFIG }}" `
            --target "${{ env.CRAFT_TARGET }}" `
            -c craft

      - name: Build upstream ghostwriter
        shell: pwsh
        run: |
          python "${{ env.CRAFT_MASTER_LOCATION }}/CraftMaster.py" `
            --config "${{ env.CRAFT_MASTER_CONFIG }}" `
            --target "${{ env.CRAFT_TARGET }}" `
            -c `
            --options ghostwriter.srcDir="https://github.com/KDE/ghostwriter.git|master|" `
            --ignoreInstalled `
            ghostwriter

      - name: Package ghostwriter
        shell: pwsh
        run: |
          python "${{ env.CRAFT_MASTER_LOCATION }}/CraftMaster.py" `
            --config "${{ env.CRAFT_MASTER_CONFIG }}" `
            --target "${{ env.CRAFT_TARGET }}" `
            -c `
            --package `
            ghostwriter

      - name: Find Craft package
        shell: pwsh
        run: |
          Write-Host "Searching for Craft packages..."

          Get-ChildItem `
            "${{ github.workspace }}\${{ env.CRAFT_TARGET }}\tmp" `
            -Recurse `
            -File `
            -ErrorAction SilentlyContinue |
            Select-Object FullName, Length

          $installer = Get-ChildItem `
            "${{ github.workspace }}\${{ env.CRAFT_TARGET }}\tmp" `
            -Recurse `
            -Filter "ghostwriter*.exe" `
            -File `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $installer) {
            Write-Error "Craft did not produce a ghostwriter installer."
            exit 1
          }

          Copy-Item `
            $installer.FullName `
            "${{ github.workspace }}\ghostwriter-windows-x64-installer.exe"

          Write-Host "Installer:"
          Write-Host $installer.FullName

      - name: Locate installed ghostwriter
        shell: pwsh
        run: |
          $exe = Get-ChildItem `
            "${{ github.workspace }}\${{ env.CRAFT_TARGET }}" `
            -Recurse `
            -Filter "ghostwriter.exe" `
            -File `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $exe) {
            Write-Error "ghostwriter.exe was not found."
            exit 1
          }

          Write-Host "Found:"
          Write-Host $exe.FullName

          "GHOSTWRITER_EXE=$($exe.FullName)" >> $env:GITHUB_ENV

      - name: Create portable ZIP
        shell: pwsh
        run: |
          $exe = Get-Item $env:GHOSTWRITER_EXE

          # Find the Craft install root containing bin/ghostwriter.exe.
          $bin = $exe.Directory.FullName
          $root = Split-Path $bin -Parent

          Write-Host "Portable root:"
          Write-Host $root

          $portable = "${{ github.workspace }}\portable"

          New-Item `
            -ItemType Directory `
            -Force `
            "$portable\ghostwriter" | Out-Null

          Copy-Item `
            "$root\*" `
            "$portable\ghostwriter" `
            -Recurse `
            -Force

          Compress-Archive `
            -Path "$portable\ghostwriter\*" `
            -DestinationPath `
              "${{ github.workspace }}\ghostwriter-windows-x64-portable.zip" `
            -Force

      - name: Verify portable ZIP
        shell: pwsh
        run: |
          $zip = `
            "${{ github.workspace }}\ghostwriter-windows-x64-portable.zip"

          if (-not (Test-Path $zip)) {
            Write-Error "Portable ZIP was not created."
            exit 1
          }

          Add-Type `
            -AssemblyName System.IO.Compression.FileSystem

          $archive = `
            [System.IO.Compression.ZipFile]::OpenRead($zip)

          $exe = $archive.Entries |
            Where-Object {
              $_.FullName -eq "bin/ghostwriter.exe"
            }

          if (-not $exe) {
            $archive.Dispose()
            Write-Error `
              "Portable ZIP does not contain bin/ghostwriter.exe."
            exit 1
          }

          $archive.Dispose()

          Write-Host "Portable ZIP verified."

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: ghostwriter-windows-x64-installer
          path: ghostwriter-windows-x64-installer.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload portable Windows build
        uses: actions/upload-artifact@v4
        with:
          name: ghostwriter-windows-x64-portable
          path: ghostwriter-windows-x64-portable.zip
          if-no-files-found: error
          retention-days: 30
