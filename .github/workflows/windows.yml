name: Windows build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  CRAFT_TARGET: windows-cl-msvc2022-x86_64
  CRAFT_MASTER_LOCATION: ${{ github.workspace }}/CraftMaster
  CRAFT_MASTER_CONFIG: ${{ github.workspace }}/craftmaster.ini

jobs:
  build:
    name: Build ghostwriter
    runs-on: windows-2022
    timeout-minutes: 240

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Clone CraftMaster
        shell: pwsh
        run: |
          git clone --depth=1 `
            https://github.com/KDE/craftmaster.git `
            "${{ env.CRAFT_MASTER_LOCATION }}"

      - name: Install CraftMaster blueprint
        shell: pwsh
        run: |
          $blueprintRoot = Join-Path `
            "${{ env.CRAFT_MASTER_LOCATION }}" `
            "blueprints"

          $ghostwriterDir = Join-Path `
            $blueprintRoot `
            "kde\ghostwriter"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $ghostwriterDir | Out-Null

          @'
          import info

          from Package.CMakePackageBase import CMakePackageBase


          class subinfo(info.infoclass):

              def setTargets(self):
                  self.displayName = "ghostwriter"
                  self.description = "Text editor for Markdown"
                  self.webpage = "https://github.com/KDE/ghostwriter"

                  self.svnTargets["master"] = \
                      "https://github.com/KDE/ghostwriter.git|master"

                  self.defaultTarget = "master"

              def setDependencies(self):
                  self.buildDependencies[
                      "kde/frameworks/extra-cmake-modules"
                  ] = None

                  self.runtimeDependencies["libs/qt/qtbase"] = None
                  self.runtimeDependencies["libs/qt/qtsvg"] = None
                  self.runtimeDependencies["libs/qt/qtwebchannel"] = None
                  self.runtimeDependencies["libs/qt/qtwebengine"] = None

                  self.runtimeDependencies[
                      "kde/frameworks/tier1/kcoreaddons"
                  ] = None

                  self.runtimeDependencies[
                      "kde/frameworks/tier1/kwidgetsaddons"
                  ] = None

                  self.runtimeDependencies[
                      "kde/frameworks/tier1/sonnet"
                  ] = None

                  self.runtimeDependencies[
                      "kde/frameworks/tier2/kconfig"
                  ] = None

                  self.runtimeDependencies[
                      "kde/frameworks/tier3/kconfigwidgets"
                  ] = None

                  self.runtimeDependencies[
                      "kde/frameworks/tier3/kxmlgui"
                  ] = None

                  self.runtimeDependencies[
                      "kde/frameworks/tier3/kiconthemes"
                  ] = None

                  self.runtimeDependencies[
                      "kde/frameworks/tier1/breeze-icons"
                  ] = None


          class Package(CMakePackageBase):

              def __init__(self, **args):
                  CMakePackageBase.__init__(self, **args)
          '@ | Set-Content `
            -Encoding UTF8 `
            (Join-Path $ghostwriterDir "ghostwriter.py")

      - name: Create CraftMaster configuration
        shell: pwsh
        run: |
          $root = "${{ github.workspace }}\craft-work"

          @"
          [General]
          Branch = master
          ShallowClone = True

          [Variables]
          Root = $root

          [GeneralSettings]
          Compile/BuildType = Release
          ContinuousIntegration/Enabled = True
          General/KDECompiler = msvc2022
          General/Architecture = x64

          [$env:CRAFT_TARGET]
          General/KDECompiler = msvc2022
          General/Architecture = x64
          "@ | Set-Content `
            -Encoding UTF8 `
            "${{ env.CRAFT_MASTER_CONFIG }}"

          Write-Host "CraftMaster configuration:"
          Get-Content "${{ env.CRAFT_MASTER_CONFIG }}"

      - name: Set up Visual Studio environment
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

          $vsPath = & $vswhere `
            -latest `
            -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath

          if (-not $vsPath) {
            throw "Visual Studio 2022 with MSVC was not found."
          }

          $vsPath = $vsPath.Trim()

          Write-Host "Visual Studio: $vsPath"

          $vsDevCmd = Join-Path `
            $vsPath `
            "Common7\Tools\VsDevCmd.bat"

          if (-not (Test-Path $vsDevCmd)) {
            throw "VsDevCmd.bat not found: $vsDevCmd"
          }

          # Import the complete VS developer environment into
          # the GitHub Actions environment.
          $envDump = cmd.exe /s /c `
            "`"$vsDevCmd`" -arch=x64 -host_arch=x64 && set"

          foreach ($line in $envDump) {
            if ($line -match '^([^=]+)=(.*)$') {
              $name = $matches[1]
              $value = $matches[2]

              # Avoid writing pseudo variables.
              if ($name -and $value) {
                "$name=$value" >> $env:GITHUB_ENV
                Set-Item "env:$name" $value
              }
            }
          }

          Write-Host ""
          Write-Host "VSINSTALLDIR=$env:VSINSTALLDIR"
          Write-Host "VCINSTALLDIR=$env:VCINSTALLDIR"

          Write-Host ""
          Write-Host "cl.exe:"
          where.exe cl

          Write-Host ""
          Write-Host "cmake.exe:"
          where.exe cmake

          Write-Host ""
          Write-Host "MSBuild.exe:"
          where.exe msbuild






      - name: Set up Craft
        shell: pwsh
        run: |
          python "${{ env.CRAFT_MASTER_LOCATION }}/CraftMaster.py" `
            --config "${{ env.CRAFT_MASTER_CONFIG }}" `
            --targets "${{ env.CRAFT_TARGET }}" `
            --setup

      - name: Fix Craft Visual Studio detection
        shell: pwsh
        run: |
          $craftVsWhere = "${{ github.workspace }}\craft-work\${{ env.CRAFT_TARGET }}\craft\bin\3rdparty\vswhere\vswhere.exe"
          $systemVsWhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

          Write-Host "Craft vswhere:"
          Write-Host $craftVsWhere

          Write-Host "System vswhere:"
          Write-Host $systemVsWhere

          if (-not (Test-Path $craftVsWhere)) {
            Write-Host ""
            Write-Host "Craft's expected vswhere was not found."
            Write-Host "Searching for it..."

            Get-ChildItem `
              "${{ github.workspace }}\craft-work\${{ env.CRAFT_TARGET }}\craft" `
              -Recurse `
              -File `
              -Filter "vswhere.exe" `
              -ErrorAction SilentlyContinue |
              ForEach-Object {
                Write-Host $_.FullName
              }

            throw "Craft's bundled vswhere.exe was not found."
          }

          if (-not (Test-Path $systemVsWhere)) {
            throw "System vswhere.exe was not found."
          }

          Write-Host ""
          Write-Host "Craft vswhere version:"
          & $craftVsWhere -version

          Write-Host ""
          Write-Host "System vswhere version:"
          & $systemVsWhere -version

          Write-Host ""
          Write-Host "Visual Studio detected by system vswhere:"
          & $systemVsWhere `
            -latest `
            -products "*" `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath

          Write-Host ""
          Write-Host "Replacing Craft's bundled vswhere..."

          Copy-Item `
            $systemVsWhere `
            $craftVsWhere `
            -Force

          Write-Host ""
          Write-Host "Testing Craft's vswhere:"

          $result = & $craftVsWhere `
            -property installationPath `
            -nologo `
            -latest `
            -products "*" `
            -version "[17,18)" `
            -requires "Microsoft.VisualStudio.Component.VC.Tools.x86.x64"

          if (-not $result) {
            throw "Craft's vswhere still cannot find Visual Studio 2022."
          }

          Write-Host "Found Visual Studio:"
          Write-Host $result



      - name: Show Craft environment
        shell: pwsh
        run: |
          $craftRoot = "${{ github.workspace }}\craft-work"

          Write-Host "Craft root:"
          Get-ChildItem $craftRoot

          Write-Host ""
          Write-Host "Craft settings:"
          Get-Content `
            "$craftRoot\${{ env.CRAFT_TARGET }}\etc\CraftSettings.ini" `
            -ErrorAction Stop



      - name: Diagnose Craft Visual Studio detection
        shell: pwsh
        run: |
          $craft = "${{ github.workspace }}\craft-work\${{ env.CRAFT_TARGET }}\craft"

          Write-Host "=== Craft source ==="
          Write-Host $craft

          Write-Host "=== Searching Craft for the exact error ==="

          Get-ChildItem `
            $craft `
            -Recurse `
            -File `
            -Include *.py |
            Select-String `
              -Pattern "Unable to locate Visual Studio" `
              -Context 8,12 |
            ForEach-Object {
              Write-Host ""
              Write-Host "FILE: $($_.Path)"
              Write-Host "LINE: $($_.LineNumber)"
              $_.Context.PreContext | ForEach-Object { Write-Host $_ }
              Write-Host ">>> $($_.Line)"
              $_.Context.PostContext | ForEach-Object { Write-Host $_ }
            }

          Write-Host ""
          Write-Host "=== Craft compiler settings ==="

          Get-ChildItem `
            $craft `
            -Recurse `
            -File `
            -Include *.py |
            Select-String `
              -Pattern "VisualStudio|vswhere|VSINSTALLDIR|KDECompiler|msvc2022" |
            Select-Object -First 100 |
            ForEach-Object {
              Write-Host "$($_.Path):$($_.LineNumber): $($_.Line)"
            }


      - name: Build ghostwriter
        shell: pwsh
        run: |
          $craft = "${{ github.workspace }}\craft-work\${{ env.CRAFT_TARGET }}\craft"

          $craftVsWhere = Join-Path `
            $craft `
            "bin\3rdparty\vswhere\vswhere.exe"

          $systemVsWhere = `
            "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

          if (-not (Test-Path $craftVsWhere)) {
            throw "Craft vswhere not found: $craftVsWhere"
          }

          Copy-Item `
            $systemVsWhere `
            $craftVsWhere `
            -Force

          Write-Host "Craft vswhere replaced."

          $found = & $craftVsWhere `
            -property installationPath `
            -nologo `
            -latest `
            -products "*"

          Write-Host "Craft will see Visual Studio at:"
          Write-Host $found

          if (-not $found) {
            throw "Craft vswhere cannot find Visual Studio."
          }

          Write-Host ""
          Write-Host "Running Craft..."

          python "${{ env.CRAFT_MASTER_LOCATION }}/CraftMaster.py" `
            --config "${{ env.CRAFT_MASTER_CONFIG }}" `
            --targets "${{ env.CRAFT_TARGET }}" `
            -c `
            --install-deps `
            ghostwriter


      - name: Package ghostwriter
        shell: pwsh
        run: |
          python "${{ env.CRAFT_MASTER_LOCATION }}/CraftMaster.py" `
            --config "${{ env.CRAFT_MASTER_CONFIG }}" `
            --targets "${{ env.CRAFT_TARGET }}" `
            -c `
            --package `
            ghostwriter

      - name: Find generated installer
        shell: pwsh
        run: |
          $root = "${{ github.workspace }}\craft-work\${{ env.CRAFT_TARGET }}"

          Write-Host "Searching for ghostwriter installer under:"
          Write-Host $root

          $installer = Get-ChildItem `
            $root `
            -Recurse `
            -File `
            -Filter "ghostwriter*.exe" `
            -ErrorAction SilentlyContinue |
            Where-Object {
              $_.FullName -notmatch "\\bin\\ghostwriter\.exe$"
            } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if (-not $installer) {
            Write-Host "Files matching ghostwriter:"
            Get-ChildItem `
              $root `
              -Recurse `
              -File `
              -ErrorAction SilentlyContinue |
              Where-Object {
                $_.Name -match "ghostwriter"
              } |
              Select-Object FullName, Length

            throw "Could not find the generated ghostwriter installer."
          }

          Write-Host "Installer found:"
          Write-Host $installer.FullName

          Copy-Item `
            $installer.FullName `
            "${{ github.workspace }}\ghostwriter-windows-x64-installer.exe"

      - name: Locate installed ghostwriter
        shell: pwsh
        run: |
          $root = "${{ github.workspace }}\craft-work\${{ env.CRAFT_TARGET }}"

          $exe = Get-ChildItem `
            $root `
            -Recurse `
            -File `
            -Filter "ghostwriter.exe" `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $exe) {
            throw "Could not find ghostwriter.exe."
          }

          Write-Host "ghostwriter.exe:"
          Write-Host $exe.FullName

          "GHOSTWRITER_ROOT=$($exe.Directory.Parent.FullName)" `
            >> $env:GITHUB_ENV

      - name: Create portable ZIP
        shell: pwsh
        run: |
          $root = $env:GHOSTWRITER_ROOT

          Write-Host "Portable application root:"
          Write-Host $root

          $portableRoot = `
            "${{ github.workspace }}\portable\ghostwriter"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $portableRoot | Out-Null

          Copy-Item `
            "$root\*" `
            $portableRoot `
            -Recurse `
            -Force

          Compress-Archive `
            -Path "$portableRoot\*" `
            -DestinationPath `
              "${{ github.workspace }}\ghostwriter-windows-x64-portable.zip" `
            -Force

      - name: Verify portable ZIP
        shell: pwsh
        run: |
          $zip = `
            "${{ github.workspace }}\ghostwriter-windows-x64-portable.zip"

          if (-not (Test-Path $zip)) {
            throw "Portable ZIP was not created."
          }

          Add-Type `
            -AssemblyName System.IO.Compression.FileSystem

          $archive = `
            [System.IO.Compression.ZipFile]::OpenRead($zip)

          $exe = $archive.Entries |
            Where-Object {
              $_.FullName -eq "bin/ghostwriter.exe"
            }

          if (-not $exe) {
            $archive.Dispose()
            throw "Portable ZIP does not contain bin/ghostwriter.exe."
          }

          $archive.Dispose()

          Write-Host "Portable ZIP verified successfully."

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: ghostwriter-windows-x64-installer
          path: ghostwriter-windows-x64-installer.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload portable Windows build
        uses: actions/upload-artifact@v4
        with:
          name: ghostwriter-windows-x64-portable
          path: ghostwriter-windows-x64-portable.zip
          if-no-files-found: error
          retention-days: 30
